<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis · audio check</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0b1020;
    color: #dbe3f4;
    padding: 24px;
    min-height: 100vh;
  }
  h1 { font-size: 17px; color: #7dd3fc; letter-spacing: .04em; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
  .step { margin: 14px 0; padding: 14px; border: 1px solid #1e293b; border-radius: 10px; background: #0f172a; }
  .step h2 { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  button {
    font-size: 15px; font-weight: 600; color: #fff;
    background: #2563eb; border: none; border-radius: 8px;
    padding: 10px 18px; cursor: pointer;
  }
  button:disabled { background: #334155; cursor: default; }
  #talk-btn {
    width: 100%; padding: 22px; font-size: 17px;
    background: #7c3aed; user-select: none; touch-action: none;
  }
  #talk-btn.recording { background: #dc2626; }
  #meter { height: 10px; background: #1e293b; border-radius: 5px; margin-top: 10px; overflow: hidden; }
  #meter div { height: 100%; width: 0%; background: linear-gradient(90deg,#22d3ee,#a78bfa); transition: width 60ms linear; }
  #devices, #stats { font-size: 12.5px; color: #94a3b8; line-height: 1.7; margin-top: 10px; font-family: ui-monospace, monospace; }
  #stats b { color: #34d399; }
  audio { width: 100%; margin-top: 12px; }
  .log { font: 12px ui-monospace, monospace; color: #64748b; margin-top: 16px; line-height: 1.7; }
  .log .ok { color: #34d399; }
  .log .err { color: #f87171; }
</style>
</head>
<body>
<h1>JARVIS · AUDIO CHECK</h1>
<div class="sub">Phase 0 — proving mic + speaker through WSLg before building the face.</div>

<div class="step">
  <h2>1 · Speakers</h2>
  <button id="tone-btn">Play test tone</button>
</div>

<div class="step">
  <h2>2 · Microphone</h2>
  <button id="mic-btn">Enable microphone</button>
  <div id="devices"></div>
</div>

<div class="step">
  <h2>3 · Record &amp; play back</h2>
  <button id="talk-btn" disabled>Hold to talk</button>
  <div id="meter"><div></div></div>
  <div id="stats"></div>
  <audio id="playback" controls style="display:none"></audio>
</div>

<div class="step">
  <h2>4 · Jarvis speaks</h2>
  <input type="text" id="say-text" style="width:100%;font-size:15px;padding:10px 12px;border:1px solid #334155;border-radius:8px;background:#0b1020;color:#dbe3f4;margin-bottom:10px"
         value="Good evening. All systems are online and running within normal parameters.">
  <button id="say-btn">Speak</button>
  <div id="say-stats" style="font:12.5px ui-monospace,monospace;color:#94a3b8;margin-top:10px"></div>
</div>

<div class="log" id="log"></div>

<script>
"use strict";

const log = (msg, cls = "") => {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = "· " + msg;
  document.getElementById("log").appendChild(line);
};

// ---- step 1: output path ---------------------------------------------------

document.getElementById("tone-btn").onclick = () => {
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = 440;
  gain.gain.setValueAtTime(0.25, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.85);
  log("played 440 Hz tone — if you heard it, speakers work", "ok");
};

// ---- step 2: mic permission + device inventory -----------------------------

let stream = null;

document.getElementById("mic-btn").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
    });
  } catch (err) {
    log("microphone failed: " + err.name + " — " + err.message, "err");
    return;
  }
  log("microphone granted", "ok");
  document.getElementById("mic-btn").disabled = true;
  document.getElementById("mic-btn").textContent = "Microphone enabled";
  document.getElementById("talk-btn").disabled = false;

  const devices = await navigator.mediaDevices.enumerateDevices();
  const lines = devices
    .filter((d) => d.kind.startsWith("audio"))
    .map((d) => `${d.kind}: ${d.label || "(unnamed)"}`);
  document.getElementById("devices").innerHTML = lines.join("<br>");
};

// ---- step 3: hold-to-talk, then decode and measure what was captured -------

let recorder = null;
let chunks = [];
let meterRAF = null;

const talkBtn = document.getElementById("talk-btn");

function startMeter() {
  const ctx = new AudioContext();
  const src = ctx.createMediaStreamSource(stream);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  const buf = new Uint8Array(analyser.frequencyBinCount);
  const bar = document.querySelector("#meter div");
  const step = () => {
    analyser.getByteTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v - 128) / 128);
    bar.style.width = Math.min(100, peak * 140) + "%";
    meterRAF = requestAnimationFrame(step);
  };
  step();
  return ctx;
}

let meterCtx = null;

// ---- step 4: Jarvis speaks (round trip through /say -> TTS -> speakers) ----

document.getElementById("say-btn").onclick = async () => {
  const btn = document.getElementById("say-btn");
  const stats = document.getElementById("say-stats");
  const text = document.getElementById("say-text").value.trim();
  if (!text) return;
  btn.disabled = true;
  stats.textContent = "synthesizing…";
  const t0 = performance.now();
  try {
    const res = await fetch("/say", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || res.status);
    }
    const blob = await res.blob();
    const ms = Math.round(performance.now() - t0);
    const audio = new Audio(URL.createObjectURL(blob));
    await audio.play();
    stats.textContent = `${ms}ms to first audio · ${(blob.size / 1024).toFixed(1)} KB mp3`;
    log(`jarvis spoke (${ms}ms, ${(blob.size / 1024).toFixed(1)} KB)`, "ok");
  } catch (err) {
    stats.textContent = "failed: " + err.message;
    log("speech failed: " + err.message, "err");
  } finally {
    btn.disabled = false;
  }
};

talkBtn.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!stream || recorder) return;
  chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: "audio/webm;codecs=opus" });
  recorder.ondataavailable = (ev) => chunks.push(ev.data);
  recorder.start();
  talkBtn.classList.add("recording");
  talkBtn.textContent = "Recording… release to stop";
  meterCtx = startMeter();
});

talkBtn.addEventListener("pointerup", async () => {
  if (!recorder) return;
  const rec = recorder;
  recorder = null;
  cancelAnimationFrame(meterRAF);
  if (meterCtx) meterCtx.close();
  document.querySelector("#meter div").style.width = "0%";
  talkBtn.classList.remove("recording");
  talkBtn.textContent = "Hold to talk";

  await new Promise((resolve) => { rec.onstop = resolve; rec.stop(); });
  const blob = new Blob(chunks, { type: "audio/webm" });

  // Decode what was actually captured and measure it — a dead mic shows up
  // here as ~0% peak even though a file was produced.
  const ctx = new AudioContext();
  const audioBuf = await ctx.decodeAudioData(await blob.arrayBuffer());
  const data = audioBuf.getChannelData(0);
  let peak = 0, sum = 0;
  for (const v of data) { peak = Math.max(peak, Math.abs(v)); sum += v * v; }
  const rms = Math.sqrt(sum / data.length);
  ctx.close();

  document.getElementById("stats").innerHTML =
    `captured <b>${audioBuf.duration.toFixed(2)}s</b> · ` +
    `${(blob.size / 1024).toFixed(1)} KB webm/opus · ` +
    `peak <b>${(peak * 100).toFixed(0)}%</b> · rms ${(rms * 100).toFixed(1)}%`;

  const player = document.getElementById("playback");
  player.src = URL.createObjectURL(blob);
  player.style.display = "block";
  player.play();
  log(`recorded ${audioBuf.duration.toFixed(2)}s, peak ${(peak * 100).toFixed(0)}% — playing back`, "ok");
  if (peak < 0.02) log("peak is near zero — the mic is capturing silence", "err");
});
</script>
</body>
</html>
