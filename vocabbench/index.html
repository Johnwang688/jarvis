<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Bench</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .bar {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; color: #6b7280; margin-bottom: 14px;
  }
  #timer { font-variant-numeric: tabular-nums; font-weight: 600; }
  #timer.low { color: #dc2626; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .prompt { font-size: 19px; font-weight: 600; line-height: 1.45; margin: 14px 0 18px; }
  .mask { letter-spacing: 3px; font-family: ui-monospace, monospace; font-size: 22px; }
  .muted { color: #6b7280; font-size: 15px; line-height: 1.5; }
  .options { display: grid; gap: 10px; margin: 16px 0; }
  .options label {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #d1d5db; border-radius: 8px;
    padding: 11px 14px; font-size: 17px; cursor: pointer;
  }
  .options label:hover { background: #f9fafb; }
  input[type="text"] {
    width: 100%; font-size: 17px; padding: 11px 14px;
    border: 1px solid #d1d5db; border-radius: 8px; margin: 14px 0;
  }
  .match-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin: 16px 0; }
  .match-grid button {
    background: #fff; color: #1f2937; border: 1px solid #d1d5db;
    font-weight: 500; text-align: left; font-size: 15px; padding: 10px 12px;
  }
  .match-grid button:hover { background: #f9fafb; }
  .match-grid button.sel { border-color: #2563eb; background: #eff6ff; }
  .match-grid button.done { border-color: #059669; background: #ecfdf5; }
  button {
    font-size: 15px; font-weight: 600;
    background: #2563eb; color: #fff;
    border: none; border-radius: 8px;
    padding: 11px 20px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #059669; }
  button.secondary:hover { background: #047857; }
  button.ghost { background: #fff; color: #374151; border: 1px solid #d1d5db; font-weight: 500; }
  .error { color: #dc2626; font-size: 14px; margin-top: 10px; min-height: 18px; }
  pre {
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 14px; font-size: 12.5px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; margin: 14px 0;
  }
  .copied { color: #059669; font-weight: 600; margin-left: 10px; }
  #overlay {
    position: fixed; inset: 0; background: rgba(17,24,39,.55);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #overlay .card { max-width: 360px; text-align: center; }
</style>
</head>
<body>
<div class="card" id="app"><noscript>This drill requires JavaScript.</noscript></div>

<script>
"use strict";

// ---- config from the URL (the seed makes the whole session deterministic) --

const params = new URLSearchParams(location.search);
const SEED   = parseInt(params.get("seed") || "42", 10);
const N      = Math.max(1, Math.min(parseInt(params.get("n") || "6", 10), 12));
const TIME_S = Math.max(5, parseInt(params.get("time") || "420", 10));
const IDLE_S = Math.max(1, parseInt(params.get("idle") || "45", 10));

// ---- seeded PRNG: every random draw below goes through this ---------------

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const shuffle = (arr) => {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

// ---- word bank: word, definition, example sentence containing the word ----

const WORDS = [
  { w: "abate",        d: "to become less intense",              s: "The mayor hoped the criticism would abate after the report was released." },
  { w: "candor",       d: "honest, open sincerity",              s: "She answered every question with surprising candor." },
  { w: "cursory",      d: "hasty and superficial",               s: "A cursory glance at the essay revealed dozens of typos." },
  { w: "dearth",       d: "a scarcity or lack",                  s: "The team struggled with a dearth of reliable data." },
  { w: "ebullient",    d: "overflowing with enthusiasm",         s: "The crowd grew ebullient as the home team pulled ahead." },
  { w: "frugal",       d: "careful and sparing with money",      s: "Years of frugal living let her retire early." },
  { w: "garrulous",    d: "excessively talkative",               s: "The garrulous barber never let a customer sit in silence." },
  { w: "hackneyed",    d: "overused and unoriginal",             s: "The film leaned on hackneyed plot twists no one found surprising." },
  { w: "iconoclast",   d: "one who attacks cherished beliefs",   s: "As an iconoclast, he questioned every tradition the firm held dear." },
  { w: "juxtapose",    d: "to place side by side for contrast",  s: "The exhibit chose to juxtapose medieval armor with modern fashion." },
  { w: "laconic",      d: "using very few words",                s: "His laconic reply told them the meeting had gone badly." },
  { w: "maelstrom",    d: "a violent whirlpool; turmoil",        s: "The senator was pulled into a maelstrom of controversy." },
  { w: "nadir",        d: "the lowest point",                    s: "Losing both sponsors marked the nadir of the team's season." },
  { w: "obfuscate",    d: "to make unclear or confusing",        s: "The report seemed designed to obfuscate rather than explain." },
  { w: "panacea",      d: "a cure-all for every problem",        s: "The new policy is useful, but it is no panacea for the housing crisis." },
  { w: "quixotic",     d: "idealistic and impractical",          s: "Her quixotic plan to sail the Atlantic alone alarmed her family." },
  { w: "reticent",     d: "reluctant to speak",                  s: "The witness was reticent about what she had seen that night." },
  { w: "sycophant",    d: "a self-serving flatterer",            s: "Every powerful executive attracts at least one sycophant." },
  { w: "tenacious",    d: "holding firmly; persistent",          s: "The tenacious reporter refused to drop the story." },
  { w: "ubiquitous",   d: "present everywhere at once",          s: "Smartphones have become ubiquitous in every classroom." },
  { w: "venerable",    d: "worthy of deep respect",              s: "The venerable professor had taught four generations of students." },
  { w: "capricious",   d: "given to sudden changes of mood",     s: "The capricious weather ruined two picnics in one week." },
  { w: "diligent",     d: "showing steady, careful effort",      s: "Her diligent note-taking saved the project during the audit." },
  { w: "ephemeral",    d: "lasting a very short time",           s: "Fame on the internet is often ephemeral." },
  { w: "fastidious",   d: "attentive to detail; hard to please", s: "He was fastidious about keeping his workbench spotless." },
  { w: "gregarious",   d: "sociable, fond of company",           s: "Their gregarious host introduced everyone within minutes." },
  { w: "impetuous",    d: "acting rashly without thought",       s: "An impetuous purchase left him short on rent." },
  { w: "lucid",        d: "clear and easy to understand",        s: "Her lucid explanation finally made the proof click." },
  { w: "meticulous",   d: "extremely careful and precise",       s: "The restorer was meticulous with every brushstroke." },
  { w: "nonchalant",   d: "casually unconcerned",                s: "He gave a nonchalant shrug when asked about the deadline." },
  { w: "ostentatious", d: "showy, designed to impress",          s: "The lobby's ostentatious chandelier dwarfed everything else." },
  { w: "pragmatic",    d: "practical rather than idealistic",    s: "A pragmatic manager, she shipped the imperfect fix first." },
  { w: "resilient",    d: "able to recover quickly",             s: "The resilient town rebuilt within a year of the flood." },
  { w: "scrutinize",   d: "to examine closely",                  s: "Auditors will scrutinize every receipt from the trip." },
  { w: "tangible",     d: "real and concrete; touchable",        s: "The training produced tangible gains within a month." },
  { w: "austere",      d: "severely plain; strict",              s: "The monastery's austere rooms held only a bed and a desk." },
  { w: "benevolent",   d: "kind and charitable",                 s: "A benevolent donor paid off the entire lunch debt." },
  { w: "copious",      d: "abundant, plentiful",                 s: "She took copious notes during the deposition." },
  { w: "elusive",      d: "hard to find or catch",               s: "The snow leopard remained elusive despite weeks of tracking." },
  { w: "prudent",      d: "showing careful good judgment",       s: "It is prudent to back up your files before upgrading." },
];

// ---- question generation ---------------------------------------------------

const TYPES = ["mc", "fill", "match", "spell"];
const deck = shuffle(WORDS.map((_, i) => i));
let ptr = 0;
const draw = () => WORDS[deck[ptr++]];

function distractors(target, k) {
  const out = [];
  while (out.length < k) {
    const cand = WORDS[Math.floor(rand() * WORDS.length)];
    if (cand !== target && !out.includes(cand)) out.push(cand);
  }
  return out;
}

const questions = [];
for (let i = 0; i < N; i++) {
  const type = TYPES[i % 4];
  if (type === "mc") {
    const t = draw();
    const options = shuffle([t, ...distractors(t, 3)]).map((o) => o.w);
    questions.push({ type, prompt: `Which word means: “${t.d}”?`, options, key: t.w });
  } else if (type === "fill") {
    const t = draw();
    const blanked = t.s.replace(new RegExp(t.w, "i"), "_____");
    questions.push({ type, prompt: `Fill in the blank: “${blanked}” (hint: ${t.d})`, key: t.w });
  } else if (type === "match") {
    const trio = [draw(), draw(), draw()];
    const defs = shuffle(trio.map((t) => t.d));
    const key = {};
    trio.forEach((t) => { key[t.w] = t.d; });
    questions.push({
      type, prompt: "Match each word to its definition (click a word, then its definition).",
      words: trio.map((t) => t.w), defs, key,
    });
  } else {
    const t = draw();
    const chars = t.w.split("");
    let masked = 0;
    const mask = chars.map((c, idx) => {
      if (idx === 0 || idx === chars.length - 1) return c;
      if (rand() < 0.55) { masked++; return "_"; }
      return c;
    });
    if (masked < 2) { mask[1] = "_"; mask[2] = "_"; }
    questions.push({
      type, prompt: `Spell the word meaning “${t.d}”:`, mask: mask.join(" "), key: t.w,
    });
  }
}

// ---- session state ---------------------------------------------------------

const app = document.getElementById("app");
const answers = [];
let step = -1;                 // -1 = start screen
let startedAt = 0;             // performance.now() at session start
let qStartedAt = 0;
let idleEvents = 0;
let lastActivity = performance.now();
let overlayShown = false;
let finished = false;
let tickHandle = null;

// matching state (per question)
let selWord = null;
let pairs = {};

["pointerdown", "keydown", "input"].forEach((ev) =>
  document.addEventListener(ev, () => { lastActivity = performance.now(); }, true)
);

function fmt(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function tick() {
  if (finished || step < 0) return;
  const elapsed = (performance.now() - startedAt) / 1000;
  const left = TIME_S - elapsed;
  const timer = document.getElementById("timer");
  if (timer) {
    timer.textContent = `⏱ ${fmt(Math.max(0, left))}`;
    timer.classList.toggle("low", left < 30);
  }
  if (left <= 0) { endSession(true); return; }
  if (!overlayShown && (performance.now() - lastActivity) / 1000 > IDLE_S) {
    showOverlay();
  }
}

function showOverlay() {
  overlayShown = true;
  idleEvents += 1;
  const overlay = document.createElement("div");
  overlay.id = "overlay";
  overlay.innerHTML = `
    <div class="card">
      <h1>Are you still there?</h1>
      <p class="muted" style="margin:10px 0 18px">The session is paused until you respond.</p>
      <button id="resume-btn">Resume drill</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("resume-btn").onclick = () => {
    overlay.remove();
    overlayShown = false;
    lastActivity = performance.now();
  };
}

// ---- screens ---------------------------------------------------------------

function renderStart() {
  app.innerHTML = `
    <h1>Vocabulary Drill</h1>
    <p class="muted">${N} questions · ${fmt(TIME_S)} time limit · seed ${SEED}.
       Question types: multiple choice, fill-in-the-blank, matching, and spelling.
       Long pauses trigger an attention check.</p>
    <p style="margin:20px 0 0"><button id="start-btn">Start drill</button></p>`;
  document.getElementById("start-btn").onclick = () => {
    step = 0;
    startedAt = performance.now();
    tickHandle = setInterval(tick, 500);
    renderQuestion();
  };
}

function headerHTML() {
  return `<div class="bar">
    <span>Question ${step + 1} of ${N}</span>
    <span id="timer">⏱ ${fmt(TIME_S)}</span>
  </div>`;
}

function renderQuestion() {
  const q = questions[step];
  selWord = null;
  pairs = {};
  qStartedAt = performance.now();
  window.__answerKey = q.key;   // for test harnesses only — agents cannot run JS

  let body = "";
  if (q.type === "mc") {
    body = `<div class="options">${q.options.map((w) => `
      <label><input type="radio" name="answer" value="${w}" aria-label="answer ${w}"> ${w}</label>`).join("")}
    </div>`;
  } else if (q.type === "fill" || q.type === "spell") {
    const mask = q.mask ? `<div class="prompt mask">${q.mask}</div>` : "";
    body = `${mask}<input type="text" id="answer" placeholder="Type your answer" aria-label="your answer" autocomplete="off">`;
  } else {
    body = `
      <div class="match-grid">
        <div style="display:grid;gap:10px">${q.words.map((w, i) => `
          <button class="match-word" data-w="${w}" id="mw-${i}">${w}</button>`).join("")}
        </div>
        <div style="display:grid;gap:10px">${q.defs.map((d, i) => `
          <button class="match-def" data-d="${d}" id="md-${i}">${d}</button>`).join("")}
        </div>
      </div>
      <button class="ghost" id="clear-btn">Clear pairs</button>`;
  }

  const last = step === N - 1;
  app.innerHTML = `
    ${headerHTML()}
    <div class="prompt">${q.prompt}</div>
    ${body}
    <p style="margin-top:14px"><button id="next-btn">${last ? "Submit answers" : "Next →"}</button></p>
    <div class="error" id="error"></div>`;

  if (q.type === "match") wireMatch(q);
  document.getElementById("next-btn").onclick = () => submitAnswer(q);
}

function wireMatch(q) {
  document.querySelectorAll(".match-word").forEach((btn) => {
    btn.onclick = () => {
      if (pairs[btn.dataset.w]) return;               // already paired
      selWord = btn.dataset.w;
      document.querySelectorAll(".match-word").forEach((b) => b.classList.remove("sel"));
      btn.classList.add("sel");
      btn.textContent = "▶ " + btn.dataset.w;
      document.querySelectorAll(".match-word").forEach((b) => {
        if (b !== btn && !pairs[b.dataset.w]) b.textContent = b.dataset.w;
      });
    };
  });
  document.querySelectorAll(".match-def").forEach((btn) => {
    btn.onclick = () => {
      if (!selWord || btn.classList.contains("done")) {
        document.getElementById("error").textContent = selWord ? "" : "Click a word first, then its definition.";
        return;
      }
      pairs[selWord] = btn.dataset.d;
      btn.classList.add("done");
      btn.textContent = "✓ " + btn.dataset.d;
      const wordBtn = [...document.querySelectorAll(".match-word")].find((b) => b.dataset.w === selWord);
      wordBtn.classList.remove("sel");
      wordBtn.classList.add("done");
      wordBtn.textContent = "✓ " + selWord;
      selWord = null;
      document.getElementById("error").textContent = "";
    };
  });
  document.getElementById("clear-btn").onclick = () => {
    selWord = null;
    pairs = {};
    document.querySelectorAll(".match-word, .match-def").forEach((b) => {
      b.classList.remove("sel", "done");
      b.textContent = b.dataset.w || b.dataset.d;
    });
  };
}

function submitAnswer(q) {
  let given;
  if (q.type === "mc") {
    given = document.querySelector('input[name="answer"]:checked')?.value;
  } else if (q.type === "match") {
    given = Object.keys(pairs).length === q.words.length ? { ...pairs } : null;
  } else {
    given = document.getElementById("answer").value.trim() || null;
  }
  if (!given) {
    document.getElementById("error").textContent =
      q.type === "match" ? "Pair all the words before continuing." : "Please answer before continuing.";
    return;
  }

  let correct;
  if (q.type === "match") {
    correct = q.words.every((w) => given[w] === q.key[w]);
  } else {
    correct = String(given).trim().toLowerCase() === q.key.toLowerCase();
  }

  answers.push({
    n: step + 1,
    type: q.type,
    prompt: q.prompt,
    expected: q.key,
    given,
    correct,
    ms: Math.round(performance.now() - qStartedAt),
  });

  step += 1;
  step < N ? renderQuestion() : endSession(false);
}

function endSession(timedOut) {
  if (finished) return;
  finished = true;
  clearInterval(tickHandle);
  document.getElementById("overlay")?.remove();

  const score = answers.filter((a) => a.correct).length;
  const payload = {
    bench: "vocab-bench-v1",
    seed: SEED,
    n: N,
    score,
    timedOut,
    idleEvents,
    elapsedMs: Math.round(performance.now() - startedAt),
    completedAt: new Date().toISOString(),
    answers,
  };
  window.__vocabResults = payload;
  const json = JSON.stringify(payload, null, 2);

  app.innerHTML = `
    <h1>${timedOut ? "Time's up ⏱" : "Drill complete ✓"}</h1>
    <p class="muted">Score ${score}/${N} · ${fmt(payload.elapsedMs / 1000)} elapsed ·
       ${idleEvents} attention check${idleEvents === 1 ? "" : "s"}.</p>
    <pre id="json"></pre>
    <button class="secondary" id="copy-btn">Copy JSON</button><span class="copied" id="copied"></span>`;
  document.getElementById("json").textContent = json;
  document.getElementById("copy-btn").onclick = async () => {
    try {
      await navigator.clipboard.writeText(json);
      document.getElementById("copied").textContent = "Copied!";
    } catch {
      document.getElementById("copied").textContent = "Copy blocked — select the text above.";
    }
  };
}

renderStart();
</script>
</body>
</html>
