<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Drill</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .progress { font-size: 13px; color: #6b7280; margin-bottom: 12px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .prompt { font-size: 28px; font-weight: 600; margin: 20px 0; }
  .muted { color: #6b7280; font-size: 15px; line-height: 1.5; }
  .options { display: grid; gap: 10px; margin: 20px 0; }
  .options label {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #d1d5db; border-radius: 8px;
    padding: 12px 14px; font-size: 18px; cursor: pointer;
  }
  .options label:hover { background: #f9fafb; }
  input[type="text"] {
    width: 100%; font-size: 18px; padding: 12px 14px;
    border: 1px solid #d1d5db; border-radius: 8px; margin: 20px 0;
  }
  button {
    font-size: 16px; font-weight: 600;
    background: #2563eb; color: #fff;
    border: none; border-radius: 8px;
    padding: 12px 22px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #059669; }
  button.secondary:hover { background: #047857; }
  .error { color: #dc2626; font-size: 14px; margin-top: 10px; min-height: 18px; }
  pre {
    background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 14px; font-size: 13px; overflow-x: auto;
    white-space: pre-wrap; word-break: break-all; margin: 16px 0;
  }
  .copied { color: #059669; font-weight: 600; margin-left: 10px; }
</style>
</head>
<body>
<div class="card" id="app"><noscript>This drill requires JavaScript.</noscript></div>

<script>
"use strict";

// ---- question generation (randomized each load) ---------------------------

const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const shuffle = (a) => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function mcOptions(correct) {
  const opts = new Set([correct]);
  while (opts.size < 4) {
    const delta = rint(1, 9) * (Math.random() < 0.5 ? -1 : 1);
    if (correct + delta > 0) opts.add(correct + delta);
  }
  return shuffle([...opts]);
}

function makeQuestions() {
  const qs = [];

  let a = rint(6, 12), b = rint(6, 12);
  qs.push({ type: "multiple-choice", question: `${a} × ${b} = ?`, options: mcOptions(a * b) });

  a = rint(17, 89); b = rint(17, 89);
  qs.push({ type: "fill-in", question: `${a} + ${b} = ?` });

  a = rint(40, 99); b = rint(11, a - 1);
  qs.push({ type: "multiple-choice", question: `${a} − ${b} = ?`, options: mcOptions(a - b) });

  const div = rint(3, 9), quot = rint(3, 12);
  qs.push({ type: "fill-in", question: `${div * quot} ÷ ${div} = ?` });

  return qs;
}

// ---- wizard ----------------------------------------------------------------

const questions = makeQuestions();
const answers = [];
let step = -1; // -1 = start screen
const app = document.getElementById("app");

function renderStart() {
  app.innerHTML = `
    <h1>Math Practice Drill</h1>
    <p class="muted">Four quick arithmetic questions, one at a time.
       Answer each one and submit at the end.</p>
    <p style="margin:20px 0 0">
      <button id="start-btn">Start practice</button>
    </p>`;
  document.getElementById("start-btn").onclick = () => { step = 0; renderQuestion(); };
}

function renderQuestion() {
  const q = questions[step];
  const last = step === questions.length - 1;
  const input = q.type === "multiple-choice"
    ? `<div class="options">${q.options.map((o) => `
        <label><input type="radio" name="answer" value="${o}" aria-label="answer ${o}"> ${o}</label>`).join("")}
      </div>`
    : `<input type="text" id="answer" inputmode="numeric" placeholder="Type your answer" aria-label="your answer">`;

  app.innerHTML = `
    <div class="progress">Question ${step + 1} of ${questions.length}</div>
    <div class="prompt">${q.question}</div>
    ${input}
    <button id="next-btn">${last ? "Submit answers" : "Next →"}</button>
    <div class="error" id="error"></div>`;

  document.getElementById("next-btn").onclick = () => {
    const given = q.type === "multiple-choice"
      ? document.querySelector('input[name="answer"]:checked')?.value
      : document.getElementById("answer").value.trim();
    if (!given) {
      document.getElementById("error").textContent = "Please answer before continuing.";
      return;
    }
    answers.push({ n: step + 1, type: q.type, question: q.question, given });
    step += 1;
    step < questions.length ? renderQuestion() : renderResults();
  };
}

function renderResults() {
  const payload = {
    drill: "math-drill-v1",
    completedAt: new Date().toISOString(),
    answers,
  };
  const json = JSON.stringify(payload, null, 2);

  app.innerHTML = `
    <h1>Practice complete ✓</h1>
    <p class="muted">Answers submitted. Copy the JSON below to grade this run.</p>
    <pre id="json"></pre>
    <button class="secondary" id="copy-btn">Copy JSON</button><span class="copied" id="copied"></span>`;
  document.getElementById("json").textContent = json;

  document.getElementById("copy-btn").onclick = async () => {
    try {
      await navigator.clipboard.writeText(json);
      document.getElementById("copied").textContent = "Copied!";
    } catch {
      // clipboard can be blocked; the <pre> is always there to select manually
      document.getElementById("copied").textContent = "Copy blocked — select the text above.";
    }
  };
}

renderStart();
</script>
</body>
</html>
