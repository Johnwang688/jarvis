[project]
name = "jarvis"
version = "0.1.0"
description = "A personal agent with a hand-rolled tool-calling loop, routed through OpenRouter."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "prompt-toolkit>=3.0",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
# Local TTS (the default backend when installed): `uv pip install -e .[voice]`
# plus the model files in ~/.cache/jarvis-tts/ — see CLAUDE.md.
voice = ["kokoro-onnx>=0.4"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
