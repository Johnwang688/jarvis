[project]
name = "jarvis"
version = "0.1.0"
description = "A personal agent with a hand-rolled tool-calling loop, routed through OpenRouter."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "prompt-toolkit>=3.0",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
# Local TTS (the default backend when installed): `uv pip install -e .[voice]`
# plus the model files in ~/.cache/jarvis-tts/ — see CLAUDE.md.
voice = ["kokoro-onnx>=0.4"]
# Second local TTS backend + voice cloning/hybrids (jarvis/pocket.py).
# pocket-tts pulls CPU PyTorch — heavyweight; install with a CPU torch index
# (e.g. UV_TORCH_BACKEND=cpu) so a multi-GB CUDA wheel doesn't ride along.
# Model weights download from Hugging Face on first use. See CLAUDE.md.
pocketvoice = ["pocket-tts>=0.1"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
