[project]
name = "jarvis"
dynamic = ["version"]
description = "A personal agent with a hand-rolled tool-calling loop, routed through OpenRouter."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "markdown-it-py>=2.2.0",
    "beautifulsoup4>=4.12",
    "prompt-toolkit>=3.0",
    "websocket-client>=1.8",
    "pillow>=12.3",
    # The phone surface passkeys (jarvis/v2/remote_auth.py, phone design PH-3).
    # Imported only when a phone pairs or signs in: a daemon without it starts.
    "webauthn>=3.0.1,<4",
    # The phone's Web Push (jarvis/v2/push.py, phone design PH-8): encryption
    # and VAPID signing. Imported only when a push is sent or subscribed.
    "pywebpush>=2.5.0,<3",
    # The SDK transport internals used by the isolated voice client can change between patch releases.
    "claude-agent-sdk>=0.2.153,<0.2.160",
    # Imported only when a saved login is read or written.
    "secretstorage>=3.3,<4",
]

[project.optional-dependencies]
# Local TTS (the default backend when installed): `uv pip install -e .[voice]`
# plus the model files in ~/.cache/jarvis-tts/ — see CLAUDE.md.
voice = ["kokoro-onnx>=0.4"]
# CUDA 12 / cuDNN 9, as used by the local speech spike. The GPU runtime
# provides the same onnxruntime module as the CPU distribution.
# Whisper on the GPU uses these wheels in the daemon. `jarvis voice setup` also
# uses the CUDA 12 requirements here for a separate Python 3.12 Kokoro worker.
# Keep GPU ONNX Runtime out of the daemon's Python 3.14 environment.
voice-gpu = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.1",
    "nvidia-cublas-cu12==12.9.3.13",
    "nvidia-cudnn-cu12==9.28.1.4",
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cufft-cu12==11.4.1.4",
    "nvidia-curand-cu12>=10.3.10,<10.4",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-nvjitlink-cu12==12.9.86",
]
# Owner setup combines this with the exact CUDA wheel pins in voice-gpu.
# The worker pins cuRAND separately because the daemon uses a version range.
voice-gpu-worker = [
    # A build wildcard: the full four-part version reads as a private address to the leak scanner.
    "nvidia-curand-cu12==10.3.10.*",
    "onnxruntime-gpu==1.23.2",
    "coloredlogs==15.0.1",
    "flatbuffers==25.12.19",
    "humanfriendly==10.0",
    "mpmath==1.3.0",
    "packaging==26.4",
    "protobuf==7.36.2",
    "sympy==1.14.0",
    "attrs==26.1.0",
    "babel==2.19.0",
    "cloudpickle==3.1.3",
    "csvw==4.2.0",
    "dlinfo==2.0.0",
    "espeakng-loader==0.2.4",
    "isodate==0.7.2",
    "joblib==1.6.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "kokoro-onnx==0.5.0",
    "language-tags==1.3.2",
    "numpy==2.5.5",
    "phonemizer-fork==3.3.2",
    "pyparsing==3.3.3",
    "python-dateutil==4.0.0",
    "rdflib==7.6.0",
    "referencing==0.37.0",
    "regex==2026.11.25",
    "rfc3986==1.5.0",
    "rpds-py==2026.9.1",
    "segments==2.4.0",
    "termcolor==3.3.0",
    "typing-extensions==4.16.0",
    "tzdata==2026.6",
    "uritemplate==4.2.0",
]
# Second local TTS backend + voice cloning/hybrids (jarvis/pocket.py).
# pocket-tts pulls CPU PyTorch — heavyweight; install with a CPU torch index
# (e.g. UV_TORCH_BACKEND=cpu) so a multi-GB CUDA wheel doesn't ride along.
# Model weights download from Hugging Face on first use. See CLAUDE.md.
pocketvoice = ["pocket-tts>=0.1"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "jarvis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jarvis", "windows"]

[tool.hatch.build.targets.wheel.force-include]
"hud/vendor/silero-vad/silero_vad_v5.1.2.onnx" = "jarvis/v3/voice/silero_vad_v5.1.2.onnx"
"hud/vendor/silero-vad/LICENSE.txt" = "jarvis/v3/voice/silero-LICENSE.txt"
