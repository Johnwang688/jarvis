[project]
name = "jarvis"
dynamic = ["version"]
description = "A personal agent with a hand-rolled tool-calling loop, routed through OpenRouter."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "markdown-it-py>=2.2.0",
    "beautifulsoup4>=4.12",
    "prompt-toolkit>=3.0",
    "websocket-client>=1.8",
    "pillow>=12.3",
    # The phone surface passkeys (jarvis/v2/remote_auth.py, phone design PH-3).
    # Imported only when a phone pairs or signs in: a daemon without it starts.
    "webauthn>=3.0.1,<4",
    # The phone's Web Push (jarvis/v2/push.py, phone design PH-8): encryption
    # and VAPID signing. Imported only when a push is sent or subscribed.
    "pywebpush>=2.5.0,<3",
    "claude-agent-sdk>=0.2.153,<0.3",
]

[project.optional-dependencies]
# Local TTS (the default backend when installed): `uv pip install -e .[voice]`
# plus the model files in ~/.cache/jarvis-tts/ — see CLAUDE.md.
voice = ["kokoro-onnx>=0.4"]
# CUDA 12 / cuDNN 9, as used by the local speech spike. The GPU runtime
# provides the same onnxruntime module as the CPU distribution.
voice-gpu = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.1",
    "onnxruntime-gpu==1.23.2",
    "nvidia-cublas-cu12==12.9.3.13",
    "nvidia-cudnn-cu12==9.28.1.4",
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cufft-cu12==11.4.1.4",
    "nvidia-curand-cu12>=10.3.10,<10.4",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-nvjitlink-cu12==12.9.86",
]
# Second local TTS backend + voice cloning/hybrids (jarvis/pocket.py).
# pocket-tts pulls CPU PyTorch — heavyweight; install with a CPU torch index
# (e.g. UV_TORCH_BACKEND=cpu) so a multi-GB CUDA wheel doesn't ride along.
# Model weights download from Hugging Face on first use. See CLAUDE.md.
pocketvoice = ["pocket-tts>=0.1"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "jarvis/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jarvis", "windows"]

[tool.hatch.build.targets.wheel.force-include]
"hud/vendor/silero-vad/silero_vad_v5.1.2.onnx" = "jarvis/v3/voice/silero_vad_v5.1.2.onnx"
"hud/vendor/silero-vad/LICENSE.txt" = "jarvis/v3/voice/silero-LICENSE.txt"
